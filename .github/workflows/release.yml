name: Release

# Pushing a version tag such as v2.1.0 builds the firmware and attaches the merged factory image to a GitHub Release, which the web flasher (web-flasher/) serves.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish firmware
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # scripts/version.py runs "git describe --tags"; a shallow checkout has no tags and would stamp "unknown".
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            .pio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      # The factory image starts at 0x0 with the bootloader and partition table, so it installs on a blank board. It ends before the LittleFS partition, so it also updates a configured device without losing settings.
      - name: Stage release binary
        run: cp .pio/build/esp32dev/firmware.factory.bin firmware.factory.bin

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: firmware.factory.bin
          generate_release_notes: true
