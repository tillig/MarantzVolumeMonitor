name: Continuous Integration

on:
  push:
    branches:
      - master
      - develop
      - feature/**
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deduplicate:
    name: Deduplicate builds
    runs-on: ubuntu-latest
    outputs:
      skip_validation: ${{ steps.duplicate.outputs.skip }}

    steps:
      - name: Check for duplicate feature branch build
        id: duplicate
        uses: actions/github-script@v9
        with:
          script: |
            const isFeaturePush =
              context.eventName === "push" &&
              context.ref.startsWith("refs/heads/feature/");

            if (!isFeaturePush) {
              core.setOutput("skip", "false");
              return;
            }

            const branch = context.ref.replace("refs/heads/", "");
            const { owner, repo } = context.repo;
            const head = `${owner}:${branch}`;
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head,
              per_page: 1,
            });

            const skip = pulls.length > 0;
            core.setOutput("skip", skip ? "true" : "false");

            if (skip) {
              core.notice(`Skipping feature branch build because ${head} already has an open pull request.`);
            }

  build:
    name: Build
    needs: deduplicate
    if: needs.deduplicate.outputs.skip_validation != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      # The platform's Python environment under ~/.platformio is bound to this Python version.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-platformio-${{ steps.python.outputs.python-version }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-${{ steps.python.outputs.python-version }}-

      # The pioarduino fork of PlatformIO Core runs pio check with the platform's cppcheck.
      - name: Install pioarduino Core
        run: pip install --upgrade pioarduino

      # The build also installs the platform's cppcheck, which pio check alone does not.
      - name: Build firmware
        run: pio run

      # pioarduino's Linux cppcheck links against PCRE 1.
      - name: Install libpcre3
        run: sudo apt-get update && sudo apt-get install --yes libpcre3

      - name: Run static analysis
        run: pio check --fail-on-defect=low
