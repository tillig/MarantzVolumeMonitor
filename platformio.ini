[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32dev
framework = arduino
board_build.partitions = no_ota.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
    bblanchon/ArduinoJson @ ^7.4.3
    LittleFS

check_tool = cppcheck
check_src_filters = +<src/>
# Skip package headers: cppcheck cannot evaluate the toolchain's __has_builtin()
# use in libstdc++ <c++config.h>, which otherwise aborts the whole check.
check_skip_packages = yes
# PROGMEM would come from the skipped <pgmspace.h>.
check_flags =
    cppcheck: --enable=warning,style,performance,portability,information --check-level=exhaustive --inline-suppr --suppress=checkersReport --suppress=*:*/.pio/libdeps/* -DPROGMEM=

build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=21
    -DTFT_RST=22
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DTOUCH_CS=14
    -DBACKLIGHT_CONTROL_PIN=13
