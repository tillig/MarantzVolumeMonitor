exclude: |
  (?x)^(
      \.vscode/c_cpp_properties\.json|
      \.vscode/extensions\.json|
      \.vscode/launch\.json
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: trailing-whitespace
      - id: check-merge-conflict
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: a9a8a861f30ed207ead7d5a3b7e8032283ba5da7  # frozen: v23.1.2
    hooks:
      - id: clang-format
        exclude: ^src/ui/assets/IconBitmaps\.cpp$
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: "5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0"  # frozen: v0.49.1
    hooks:
      - id: markdownlint
        args:
          - --fix
  - repo: https://github.com/tillig/json-sort-cli
    rev: f628ee730c3de493fe79688696555a31364f0a10  # frozen: v3.0.3
    hooks:
      - id: json-sort
        args:
          - --autofix
